name: Build SoFlow IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Generate XcodeGen project spec
        run: |
          cat > project.yml << 'XCODEGEN'
          name: SoFlow
          options:
            bundleIdPrefix: com.soflow
            deploymentTarget:
              iOS: "17.0"
          settings:
            base:
              SWIFT_VERSION: "5.9"
          targets:
            SoFlow:
              type: application
              platform: iOS
              sources:
                - Sources/SOFLOWApp
                - Sources/SOFLOWCore
              settings:
                base:
                  INFOPLIST_FILE: Assets/Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.soflow.app
                  CODE_SIGN_STYLE: Manual
                  CODE_SIGN_IDENTITY: ""
                  PROVISIONING_PROFILE_SPECIFIER: ""
              dependencies: []
          XCODEGEN

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build IPA
        run: |
          xcodebuild -project SoFlow.xcodeproj \
            -scheme SoFlow \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            build

      - name: Create IPA structure
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SoFlow.app Payload/
          zip -r SoFlow.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SoFlow-iOS-IPA
          path: SoFlow.ipa
          compression-level: 0
