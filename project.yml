name: SoFlow
options:
  bundleIdPrefix: com.soflow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SoFlow:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        INFOPLIST_FILE: Assets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.soflow.app
        PRODUCT_NAME: SoFlow
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_STYLE: Manual
        TARGETED_DEVICE_FAMILY: "1,2"
