name: SoFlow
options:
  bundleIdPrefix: com.soflow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  SoFlow:
    type: application
    platform: iOS
    sources:
      - Sources/SOFLOWApp
      - Sources/SOFLOWCore
    settings:
      base:
        INFOPLIST_FILE: Assets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.soflow.app
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies: []
